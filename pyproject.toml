[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gwModels"
version = "0.1.5"
description = "Python package to provide models for gravitational waveforms, remnants and dynamics"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Tousif Islam", email = "tousifislam24@gmail.com"},
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "gwtools",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
lal = ["lalsuite"]
surrogates = ["gwsurrogate"]
seob = ["pyseobnr"]
kicks = ["scikit-learn", "torch", "nflows"]
all = ["lalsuite", "gwsurrogate", "pyseobnr", "scikit-learn", "torch", "nflows"]

[tool.setuptools.packages.find]
include = ["gwModels*"]

[tool.setuptools.package-data]
gwModels = ["data/*.npy", "data/*.pt", "data/*.pkl"]
